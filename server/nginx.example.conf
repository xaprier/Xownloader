# Example nginx reverse-proxy config for a self-hosted Xownloader instance:
# TLS termination, the API/health/metrics proxy to the server container, and
# static hosting for the Flutter web build, on one domain.
#
# Copy this to /etc/nginx/sites-available/<your-domain>, replace every
# YOUR_* placeholder below, symlink it into sites-enabled, then run
# `certbot --nginx -d YOUR_DOMAIN` (or point ssl_certificate/ssl_certificate_key
# at certs you already have) before reloading nginx.
#
# Placeholders used below:
#   YOUR_DOMAIN            the public hostname, e.g. xownloader.example.com
#   YOUR_WEB_ROOT           where `flutter build web`'s output is deployed,
#                           e.g. /srv/xownloader/current (see update_web.sh)
#   YOUR_BACKEND_PORT       the host port the server container publishes —
#                           must match XOWNLOADER_HOST_PORT in server/.env
#                           (default 8000; server/compose.yaml binds it to
#                           127.0.0.1 only, so this proxy is the only way in)
#   YOUR_CLIENT_API_TOKEN   the same value as XOWNLOADER_CLIENT_API_TOKEN in
#                           server/.env — see the note on the /api/ block below

server {
    server_name YOUR_DOMAIN;

    root YOUR_WEB_ROOT;
    index index.html;

    access_log /var/log/nginx/YOUR_DOMAIN.access.log;
    error_log  /var/log/nginx/YOUR_DOMAIN.error.log;

    client_max_body_size 1m;

    # ---- API (server container) ----
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:YOUR_BACKEND_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The web build ships with no XOWNLOADER_CLIENT_API_TOKEN baked in —
        # unlike native builds, a browser bundle can't hide a secret from
        # anyone who opens devtools, so the web client sends no Authorization
        # header at all. This fills it in server-side, only when the
        # incoming request didn't already send one — so it does NOT
        # override a real token, and in particular does not touch the admin
        # panel's own Authorization header (the admin token is entered at
        # runtime and must reach the backend unchanged). Getting this wrong
        # in either direction either breaks the web client (never filled
        # in) or makes every admin request 401 forever (always overridden,
        # discarding whatever the client actually sent).
        set $auth_header $http_authorization;
        if ($auth_header = "") {
            set $auth_header "Bearer YOUR_CLIENT_API_TOKEN";
        }
        proxy_set_header Authorization $auth_header;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # Health/readiness/metrics: same backend, no token injection — /health
    # and /ready need none, and /metrics + the admin endpoints under /api/
    # expect the caller's own admin token to pass through untouched.
    location ~ ^/(health|ready|metrics)$ {
        proxy_pass http://127.0.0.1:YOUR_BACKEND_PORT;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # ---- Flutter web (static) ----

    # The client reads its own config from a served .env at runtime.
    location = /assets/.env {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }

    # JS/wasm chunks and font files are NOT content-hashed in their URLs the
    # way most static-site assets are, so a long browser cache here means a
    # returning visitor keeps a stale build (and, concretely, a stale
    # MaterialIcons-Regular.otf subset missing whatever icons a later build
    # added) for as long as the cache lives. Force a revalidation on every
    # load instead; Flutter's own service worker still handles real caching
    # underneath this.
    location ~* ^/(flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(js|wasm|woff2?|ttf|otf)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # These genuinely change rarely and aren't affected by the tree-shaking
    # issue above, so a real cache lifetime is safe.
    location ~* \.(css|png|jpe?g|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = YOUR_DOMAIN) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 404;
}
