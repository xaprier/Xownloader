# "version" is obsolete for Docker Compose v2 (harmless warning) but keeps the
# file parseable by the legacy docker-compose v1 still on some servers.
version: "3.8"

services:
  server:
    build:
      context: .
    image: xownloader-server
    ports:
      # Bind to loopback only; a reverse proxy on the host terminates TLS and
      # forwards to this. Set XOWNLOADER_HOST_PORT in .env to pick the host port
      # (e.g. when 8000 is taken); the reverse proxy must match it.
      - "127.0.0.1:${XOWNLOADER_HOST_PORT:-8000}:8000"
    # Deployment values (tokens, CORS, policy limits). Copy .env.example to .env
    # before the first run — this file must exist.
    env_file:
      - .env
    # Run as the host user that owns ./data so the bind-mounted downloads and
    # SQLite database are writable. Override for a different owner:
    #   XOWNLOADER_UID=$(id -u) XOWNLOADER_GID=$(id -g) docker compose up -d
    user: "${XOWNLOADER_UID:-1000}:${XOWNLOADER_GID:-1000}"
    environment:
      # The container always binds all interfaces regardless of .env.
      XOWNLOADER_HOST: 0.0.0.0
      XOWNLOADER_DOWNLOAD_DIRECTORY: /data/downloads
      XOWNLOADER_DATABASE_PATH: /data/xownloader.db
      # .env's default (./data/instagram_session.json) resolves against the
      # container's WORKDIR (/app), landing outside the bind-mounted volume —
      # the session would never persist across restarts. Force it into /data
      # like the paths above.
      XOWNLOADER_INSTAGRAM_SESSION_PATH: /data/instagram_session.json
      HOME: /tmp
      # Trust X-Forwarded-For only from the reverse proxy hop (this network's
      # gateway). A direct client cannot spoof its rate-limit identity.
      FORWARDED_ALLOW_IPS: "172.28.0.1"
    volumes:
      # Downloads and the SQLite database live on the host for backup/inspection.
      - ./data:/data
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  proxy:
    ipam:
      config:
        # Fixed subnet so FORWARDED_ALLOW_IPS above matches the gateway address
        # the reverse proxy connects from.
        - subnet: 172.28.0.0/24
